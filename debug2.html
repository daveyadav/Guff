<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guff debug2 (temporary)</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="js/config.js"></script>
<style>body{background:#0f1512;color:#e8f0eb;font-family:monospace;padding:16px;word-break:break-all}pre{white-space:pre-wrap}</style>
</head>
<body>
<pre id="out">starting…</pre>
<script>
var out = document.getElementById("out");
function log(s){ out.textContent += "\n" + s; }
function chatIdFor(a,b){ return [a,b].sort().join("_"); }
async function getDocOrNull(ref){
  try { var d = await ref.get(); return d.exists ? d : null; }
  catch (e) { return null; }
}
try {
  firebase.initializeApp(FIREBASE_CONFIG);
  var auth = firebase.auth(), db = firebase.firestore();
  var done = false;
  auth.onAuthStateChanged(async function(user){
    if (done) return; done = true;
    if (!user) { log("AUTH: no user"); return; }
    log("AUTH: " + user.uid);
    // 1. raw get on a friendships doc that does NOT exist (kaza+dave are not friends)
    var cid = chatIdFor(user.uid, "v6vdzuqJveWcxggzuKEvmX353ii2");
    try {
      var f = await db.collection("friendships").doc(cid).get();
      log("TEST1 raw friendships get: SUCCESS exists=" + f.exists);
    } catch (e) {
      log("TEST1 raw friendships get: FAILED code=" + (e && e.code) + " message=" + (e && e.message));
    }
    // 2. full fixed search flow for username "dave"
    try {
      var unDoc = await db.collection("usernames").doc("dave").get();
      var uid = unDoc.data().uid;
      var uDoc = await getDocOrNull(db.collection("users").doc(uid));
      var p = Object.assign({ uid: uid, displayName: "dave", username: "dave" }, uDoc && uDoc.data());
      var alreadyFriend = await getDocOrNull(db.collection("friendships").doc(chatIdFor(user.uid, uid)));
      var reqDoc = await getDocOrNull(db.collection("friendRequests").doc(user.uid + "_" + uid));
      var revDoc = await getDocOrNull(db.collection("friendRequests").doc(uid + "_" + user.uid));
      var action;
      if (alreadyFriend) action = "Message";
      else if (reqDoc && reqDoc.data().status === "pending") action = "Request sent";
      else if (revDoc && revDoc.data().status === "pending") action = "Incoming request";
      else action = "Add friend";
      log("TEST2 fixed search flow: SUCCESS profile=" + p.displayName + "/@" + p.username + " action=" + action);
    } catch (e) {
      log("TEST2 fixed search flow: FAILED code=" + (e && e.code) + " message=" + (e && e.message));
    }
    log("DONE");
  });
  setTimeout(function(){ if (!done) log("TIMEOUT"); }, 20000);
} catch (e) { log("INIT FAILED: " + (e && e.message)); }
</script>
</body>
</html>
