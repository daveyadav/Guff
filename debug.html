<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guff debug (temporary)</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="js/config.js"></script>
<style>body{background:#0f1512;color:#e8f0eb;font-family:monospace;padding:16px;word-break:break-all}pre{white-space:pre-wrap}</style>
</head>
<body>
<pre id="out">starting…</pre>
<script>
var out = document.getElementById("out");
function log(s){ out.textContent += "\n" + s; }
try {
  firebase.initializeApp(FIREBASE_CONFIG);
  var auth = firebase.auth(), db = firebase.firestore();
  var done = false;
  auth.onAuthStateChanged(function(user){
    if (done) return; done = true;
    if (!user) { log("AUTH: no user signed in on this browser"); return; }
    log("AUTH: signed in uid=" + user.uid + " email=" + user.email);
    db.collection("usernames").doc("dave").get().then(function(d){
      log("usernames/dave: SUCCESS exists=" + d.exists + " data=" + JSON.stringify(d.data()));
    }).catch(function(e){
      log("usernames/dave: FAILED");
      log("code=" + (e && e.code));
      log("message=" + (e && e.message));
      log("name=" + (e && e.name));
      try { log("props=" + JSON.stringify(e, Object.getOwnPropertyNames(e))); } catch(_){ log("props=unserializable"); }
      log("stack=" + ((e && e.stack) || "n/a"));
    }).then(function(){
      return db.collection("users").doc(user.uid).get();
    }).then(function(u){
      log("users/self: SUCCESS exists=" + u.exists);
    }).catch(function(e){
      log("users/self: FAILED code=" + (e && e.code) + " message=" + (e && e.message));
    });
  });
  setTimeout(function(){ if (!done) log("TIMEOUT: auth state never resolved"); }, 20000);
} catch (e) {
  log("INIT FAILED: " + (e && e.message));
}
</script>
</body>
</html>
